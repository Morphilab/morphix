# domain_tdd.yaml — Domain-Driven TDD / Scenario-Driven (preset DSL v1)
# Modelo de dominio → escenarios → mini-ciclo TDD POR escenario (incluye
# use del plugin text_to_list con marker para convertir el texto del agente
# en lista SIN ruido). Verificación por escenario: tests/test_escenario_$iter.py.
version: 1
name: domain_tdd
description: "Domain-Driven TDD — del modelo de dominio a tests por escenario"
agents:
  allowed: [developer, analista]
tools:
  allowed: ["file_manager", "diff_editor", "test_runner", "git_manager", "code_search", "pdf_read"]
project:
  required: true
skills: true
# Techo de tokens de ESTE preset (guardarraíl, no objetivo).
budget_tokens: 650000
budget_reserve_final: 60000
steps:
  - id: modelo
    kind: agent
    agent: analista
    goal: "Modela el dominio (entidades, invariantes, reglas) para: $query"
    outputs: ["modelo"]
    timeout: 300
    max_iterations: 8
  - id: dieta_modelo
    # Dieta de prompt: el modelo completo viaja en los goals de escenarios y
    # ciclo en su versión acotada — el preset patológico inyectaba TODO el
    # texto en cada prompt de cada escenario. La var original queda intacta.
    kind: plugin
    plugin: cap_text
    params:
      var: modelo
      out: modelo_cap
      max_chars: 1200
    outputs: ["modelo_cap"]
  - id: escenarios_raw
    kind: agent
    agent: analista
    goal: >-
      Lista los escenarios de dominio críticos de: $query (regla asociada
      del modelo: $modelo_cap). Respeta el máximo de escenarios que pida
      la petición: si dice "máximo N", no generes más de N. Cierra tu
      respuesta con la línea "## LISTA"
      seguida EXCLUSIVAMENTE de una viñeta (- ) por escenario — nada
      después de esa línea. Sin esa sección el workflow no tiene
      escenarios que ejecutar. Ejemplo: "## LISTA" + "- Escenario 1: ...".
    outputs: ["escenarios_raw"]
    retry_max: 1
    timeout: 300
    max_iterations: 8
  - id: parse_escenarios
    kind: plugin
    plugin: text_to_list
    params:
      var: escenarios_raw
      out: escenarios
      marker: "## LISTA"
      # cap declarado: el corte a mitad de loop ya quemó el presupuesto
      # de los escenarios que sí corrieron — truncar ANTES de ejecutar.
      max_items: 5
    outputs: ["escenarios"]
  - id: ciclo_escenario
    kind: loop
    max_iter: 5
    over: escenarios
    budget_tokens: 200000
    body:
      - id: test_escenario
        kind: agent
        agent: developer
        produces: ["tests/test_escenario_$iter.py"]
        goal: >-
          Test fallido para el escenario: $item (regla del modelo: $modelo_cap).
          El test vive EXACTAMENTE en tests/test_escenario_$iter.py (créalo
          o sobrescríbelo — no añadas otros archivos de test). El test prueba
          COMPORTAMIENTO: prohibido ejecutar pytest, pytest.main o la suite
          desde el test (subprocess/os.system); un test que corre la suite es
          una recursión, no una verificación.
        retry_max: 1
        timeout: 300
        max_iterations: 16
      - id: implementar_escenario
        kind: agent
        agent: developer
        produces: ["*.py", "src/**/*.py"]
        verified_by: tests
        goal: >-
          Implementa el comportamiento del escenario: $item. Verifica SOLO
          con tests/test_escenario_$iter.py — los fallos de otros archivos
          no pertenecen a este escenario. Escenarios previos pueden haber
          implementado ya parte del dominio: extiende o corrige lo
          existente, jamás una implementación paralela del mismo dominio.
        retry_max: 1
        timeout: 600
        max_iterations: 16
      - id: tests
        kind: tool
        tool: test_runner
        args:
          file_path: "tests/test_escenario_$iter.py"
        outputs:
          pasan: tests_all_pass
        # veredicto consumido por el motor: un rojo reprueba el step y la
        # entrega de su ciclo (antes se calculaba y se descartaba).
        verdict: pasan
  # Verificación del AGREGADO: los gates por-ítem no ven que las piezas encajen
  # entre sí (un ciclo puede romper el test de otro). Este step es el que puede
  # decir "la entrega está verde".
  # Artefactos de ESTE run para la verificación del agregado: verificar solo
  # lo que el run tocó — una suite preexistente en rojo no penaliza la
  # entrega (trade-off: lo que el run rompió sin tocar tampoco se ve).
  - id: artefactos_del_run
    kind: plugin
    plugin: files_del_run
    params:
      out: tests_del_run
      glob: "tests/**/*.py"
    outputs: ["tests_del_run"]
  - id: verificar_agregado
    kind: tool
    tool: test_runner
    args:
      file_paths: "$tests_del_run"
      # La suite del run puede superar el default de 30s (un cuelgue
      # transitorio convertía un verde en unmeasured): 120s da margen real.
      timeout: 120
    outputs:
      pasan_agregado: tests_all_pass
  # Reparación del agregado: solo si la verificación quedó en rojo. El
  # veredicto FINAL es el gate de calidad; el intermedio solo mide.
  - id: reparar_agregado
    kind: agent
    agent: developer
    when: "!$pasan_agregado"
    goal: >-
      La verificación del agregado quedó en ROJO. Corrige SOLO los tests que
      fallan de este run ($tests_del_run): no reescribas lo que ya pasa ni
      añadas archivos de test nuevos. Verifica con test_runner sobre esos
      archivos. Si el test es correcto, corrige la implementación; no
      debilites asserts ni borres casos. Si todo pasa, declara completado
      y PARA.
    retry_max: 1
    timeout: 600
    max_iterations: 10
    use_reserve_final: true
  - id: verificar_agregado_final
    kind: tool
    tool: test_runner
    args:
      file_paths: "$tests_del_run"
      timeout: 120
    outputs:
      pasan_agregado_final: tests_all_pass
    verdict: pasan_agregado_final
  - id: agregar
    kind: aggregate
    strategy: confidence
