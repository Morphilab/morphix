# collaborative.yaml — preset DSL del motor (v1)
# Debate en rondas: cada panelista ve la opinión previa (secuencia
# determinista por ronda); el moderador sintetiza al final.
version: 1
name: collaborative
description: "Multi-agent panel debate to reach consensus on complex decisions"
agents:
  allowed: ["developer", "analista", "moderador"]
tools:
  allowed: ["file_manager", "code_search", "web_search", "web_fetch", "lsp_manager"]
project:
  required: false
steps:
  - id: rondas
    kind: loop
    max_iter: 3
    body:
      - id: opinion_developer
        kind: agent
        agent: developer
        goal: "Debate (ronda sobre): $query. Opina considerando: $last_output"
      - id: opinion_analista
        kind: agent
        agent: analista
        goal: "Debate (respuesta): $query. Réplica a: $last_output"
  - id: sintesis
    kind: aggregate
    strategy: moderator
    agent: moderador
