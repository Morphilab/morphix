# coordinated.yaml — preset DSL del motor (v1)
# DECOMPOSE → loop.parallel dinámico → verificar → aggregate.
version: 1
name: coordinated
description: "Multi-agent coordinator — decompose, execute per subtask, aggregate with confidence"
agents:
  allowed: ["developer", "analista", "moderador", "architect"]
tools:
  allowed: ["file_manager", "git_manager", "bash_manager", "lsp_manager", "code_exec", "test_runner", "code_search", "diff_editor", "file_view", "web_fetch", "web_search", "goal_create", "goal_get", "goal_update", "goal_round", "todo_write", "todo_get", "plan_mode", "exit_plan_mode", "project_docs"]
project:
  required: true
skills: true
steps:
  - id: planificar
    kind: decompose
    strategy: flat
    output: subtasks
  - id: ejecutar
    kind: loop
    max_iter: 10
    over: subtasks
    parallel: true
    parallel_max: 5
    body:
      - id: subtarea
        kind: agent
        agent: developer
        goal: "Subtarea del plan multi-agente ($query): $item"
        retry_max: 2
        timeout: 300
  - id: verificar
    kind: agent
    agent: analista
    goal: "Verifica la ejecución completa de: $query"
  - id: agregar
    kind: aggregate
    strategy: confidence
