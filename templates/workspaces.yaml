# Workspaces provisionables desde templates/workspaces/<name>/
#
# Con AUTO_PROVISION_WORKSPACES=true, al arrancar la app se copian de forma
# aditiva e idempotente los agentes/workflows de templates/workspaces/<name>/
# hacia workspaces/<name>/ (el schema PostgreSQL se crea en el primer switch).
#
# Las rutas project.root de los YAML soportan expansión ${VAR:-default} y ~
# para ser portables entre máquinas.
#
# Ejemplo — crea templates/workspaces/<name>/agents/*.yaml y
# templates/workspaces/<name>/workflows/*.yaml y declara la entrada:
#
# workspaces:
#   - name: demo
#     description: "Workspace de ejemplo"
#     isolate: true

workspaces: []
