[project]
name = "morphix"
version = "1.2.0"
description = "Morphix — Multi-agent orchestration platform for AI-assisted software engineering"
authors = [{ name = "morphilab", email = "lab@morphilab.com" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: Pydantic",
    "Topic :: Software Development",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "sqlmodel",
    "python-dotenv",
    "pydantic-settings",
    "sentence-transformers",
    "faiss-cpu",
    "reportlab",
    "networkx",
    "matplotlib",
    "httpx",
    "tiktoken",
    "bcrypt",
    "cryptography",
    "pdfplumber",
    "numpy",
    "pandas",
    "psutil",
    "openai",
    "ollama",
    "RestrictedPython>=9.0",
    "asyncpg>=0.32.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "pyyaml>=6.0.3,<7.0.0",
    "gitpython>=3.2.1,<4.0.0",
    "jedi>=0.20.1,<0.21.0",
    "pyside6>=6.12.0,<7.0.0",
]

[project.urls]
homepage = "https://github.com/morphilab/morphix"
repository = "https://github.com/morphilab/morphix"

[project.scripts]
# Sin paquete (tool.uv package = false) los scripts no se instalan en el venv:
# invocar vía `uv run python -m ...` (core.mcp.server, orchestration.dsl.cli).
morphix-mcp = "core.mcp.server:run_mcp_server"
morphix-workflow = "orchestration.dsl.cli:main"
# (invocar con: uv run python -m core.skills_curator_cli)
morphix-curator = "core.skills_curator_cli:main"

[tool.uv]
# Proyecto-aplicación: uv no construye ni instala el propio paquete.
package = false
# Solo intérpretes gestionados por uv (~/.local/share/uv/python/) — jamás el
# python del sistema: un update del SO puede cambiar el intérprete bajo el venv.
python-preference = "only-managed"
# Resolución congelada a versiones conocidas-buenas — no es una actualización
# de dependencias.
constraint-dependencies = [
    "alembic==1.18.4",
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "asyncpg==0.31.0",
