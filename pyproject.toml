# torch CPU-only: sin GPU en el hardware objetivo, el wheel CUDA (~2GB) es
# peso muerto — mismo pin de versión, flavor distinto. Índice explícito para
# que NADA más resuelva desde PyTorch.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = [
    "black>=26.10.1,<27",
    "ruff>=0.17.4,<0.18",
    "mypy>=2.4.1,<3",
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.4.1.post1,<1.5",
    "pytest-cov>=7.1.0,<8",
    "pre-commit>=4.7.0,<5",
    "alembic>=1.20.1,<2",
    "types-pyyaml>=6.0.12.20261103,<7",
    "pytest-timeout>=2.4.0,<3",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.8.1,<10",
    "mkdocs-autorefs>=1.4.5,<1.5",
    "mkdocstrings[python]>=1.0.8,<1.1",
    "mkdocs-git-revision-date-localized-plugin>=1.7.0,<2",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Fixtures compartidas entre archivos de test (split de módulos gigantes):
# el nombre importado y el parámetro del mismo nombre disparan F811.
"tests/*" = ["F811"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP"]
ignore = [
    "E501",   # line too long
    "F403",   # from . import *
    "F841",   # unused variable
    "E722",   # bare except
    "B904",   # raise from
    "F821",   # undefined name
    "RUF001", "RUF002", "RUF003", "RUF012",  # en-dash y mutable attrs
    "E402",   # import not at top
    "UP038",  # isinstance tuple -> union
    "RUF006", # asyncio.create_task
]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_untyped_calls = false
files = ["core/", "llm/", "agents/", "tools/", "orchestration/", "desktop/", "viewer/", "research/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# El ratchet per-file de cobertura (tests/test_coverage_ratchet.py) requiere
# el reporte json: el addopts de abajo lo genera en TODA corrida (incluida CI).
addopts = "--cov=core --cov=llm --cov=agents --cov=tools --cov=orchestration --cov-report=term-missing --cov-report=json:coverage.json -o faulthandler_timeout=120"
